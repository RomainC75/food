services:
  front:
    build:
      context: ./front
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:${BACK_PORT}/api
    volumes:
      - ./front:/app
      - /app/node_modules
      - /app/.next


  back:
    build:
      dockerfile: Dockerfile
      context: ./back
    environment:
      - BACK_PORT=${BACK_PORT}
      - APP_NAME=${APP_NAME}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_ACCESS_EXPIRES_IN_MIN=${JWT_ACCESS_EXPIRES_IN_MIN}
      - JWT_REFRESH_EXPIRES_IN_DAYS=${JWT_REFRESH_EXPIRES_IN_DAYS}
    ports:
      - 3001:${BACK_PORT}
    volumes:
      - ./back:/app

